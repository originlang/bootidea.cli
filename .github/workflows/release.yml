name: Release

# 发布唯一入口：手动 push vX.Y.Z 标签（tag 即版本号，不依赖 release-please、不改 Cargo.toml）。
#   git tag v0.1.1 && git push origin v0.1.1
# 触发后按 tag 检出代码，构建多平台产物并挂到同名 GitHub Release。
#
# 这里刻意不跑测试、不做 fmt/clippy：GitHub Actions 只负责出正式版产物，
# 省下双平台构建加测试的分钟数。测试、检查、nightly 构建全部在本地用 act 完成，
# 见 .act/nightly.yml。发布前请先在本地跑通 act，再把 tag 推上来。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      # rust-toolchain.toml 把 channel 钉在 1.99.0，rustup 会自动装齐 rustfmt/clippy。
      - name: Install repository toolchain
        run: rustup show active-toolchain

      # 依赖里 originlang-ext-* 指向 host 仓库的 git rev。若该仓库为私有，
      # 这里需要 PAT（CARGO_NET_GIT_FETCH_WITH_CLI + credential store），否则无法拉取。
      - name: Build release binary
        run: cargo build --locked --release --target "$BUILD_TARGET"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          name="bootidea-${tag}-${BUILD_TARGET}"
          mkdir -p dist
          install -m 0755 "target/${BUILD_TARGET}/release/bootidea" "dist/${name}"
          cp README.md "dist/${name}.README.md"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}" "${name}.README.md"
          rm "dist/${name}" "dist/${name}.README.md"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG -replace '^v', ''
          $name = "bootidea-$tag-$env:BUILD_TARGET"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$env:BUILD_TARGET/release/bootidea.exe" "dist/$name.exe"
          Copy-Item README.md "dist/$name.README.md"
          Compress-Archive -Force -Path "dist/$name.exe", "dist/$name.README.md" -DestinationPath "dist/$name.zip"
          Remove-Item "dist/$name.exe", "dist/$name.README.md"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLowerInvariant()
          # 与 sha256sum 相同的 "<hash>  <file>" 格式，供发布前统一校验
          [IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n")

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create release and attach assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # 少一个平台宁可失败，也不要发半套产物
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.sha256 \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "bootidea ${RELEASE_TAG#v}" \
            --generate-notes
