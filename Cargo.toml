[package]
name = "bootidea"
description = "BootIDEA 命令行：扩展宿主、插件管理与 agent 运行"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[[bin]]
name = "bootidea"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tiny_http = "0.12"

# 宿主引擎：同进程链接，与 bootidea 一起编译。
#
# 用 git 而不是 path：本仓库可以单独检出、单独构建，不需要宿主仓库并排放在
# 同级目录。rev 锁定宿主契约的具体提交，Cargo.lock 再把它固定住；宿主升级时
# 改下面的 rev，然后跑 `cargo update`。
originlang-ext-host = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-manifest = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-permission = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-protocol = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-runtime = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-runtime-dylib = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-runtime-process = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-runtime-quickjs = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-session = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
originlang-ext-signing = { git = "https://github.com/originlang/originlang.extension.host", rev = "a218046" }
